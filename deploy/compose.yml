# Local stack. Not a deployment artifact.
#
# network_mode: host on every service is deliberate. On the primary dev machine
# a corporate VPN (NordLayer) installs nftables rules that drop traffic on
# Docker's bridge subnet, so the usual `ports:` mapping accepts the TCP
# handshake and then times out on every query. Host networking binds each
# service straight to localhost and sidesteps the bridge. Do not "fix" this back
# to port mappings. Consequence: services talk to each other via localhost.
#
#   make db-up      postgres only (the usual `make run` loop)
#   make up         postgres + the API built from backend/Dockerfile
#   make docker-dev postgres + the API in a Go toolchain container with live reload
#   make otel-up    the above plus otel-lgtm; the API exports traces, metrics and logs to it
services:
  postgres:
    image: postgres:17-alpine
    network_mode: host
    environment:
      POSTGRES_USER: dispute
      POSTGRES_PASSWORD: dispute
      POSTGRES_DB: dispute
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Fresh volumes get the API login at init; `make db-up` also applies it to existing ones.
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute -d dispute"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs to completion before the API starts; the only thing besides seed that connects as the owner.
  migrate:
    build:
      context: ../backend
      network: host # same bridge problem during `go mod download`; see header
      args:
        GO_VERSION: ${GO_VERSION:-1.27.1}
        VERSION: ${VERSION:-dev}
    entrypoint: ["/migrate"]
    network_mode: host
    profiles: [app, otel, dev]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISPUTE_MIGRATE_DATABASE_URL: postgres://dispute:dispute@localhost:5432/dispute?sslmode=disable

  api:
    build:
      context: ../backend
      network: host
      args:
        GO_VERSION: ${GO_VERSION:-1.27.1}
        VERSION: ${VERSION:-dev}
    network_mode: host
    profiles: [app, otel]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DISPUTE_ADDR: ":8090"
      DISPUTE_DATABASE_URL: postgres://dispute_api:dispute_api@localhost:5432/dispute?sslmode=disable
      # deploy/otel.env fills these under the otel profile; empty means instrumented, nothing exported.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-dispute-engine}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}

  # Toolchain container for a fully dockerised dev loop; air watches the bind mount.
  api-dev:
    image: golang:${GO_VERSION:-1.27.1}
    network_mode: host
    profiles: [dev]
    working_dir: /src
    command: sh -c "go run github.com/air-verse/air@v1.67.4"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    environment:
      DISPUTE_ADDR: ":8090"
      DISPUTE_DATABASE_URL: postgres://dispute_api:dispute_api@localhost:5432/dispute?sslmode=disable

  # Grafana + Loki + Tempo + Mimir + an OTel Collector in one image; OTLP on 4317/4318, UI on 3001 (admin/admin).
  lgtm:
    image: grafana/otel-lgtm:0.33.1
    network_mode: host
    profiles: [otel]
    environment:
      ENABLE_LOGS_ALL: "false"
      GF_SERVER_HTTP_PORT: "3001" # 3000 is commonly taken by a Next.js dev server on the dev machine
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Retention: a week of local data, then the volume stops growing.
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=${LGTM_RETENTION:-168h}"
      LGTM_RETENTION: ${LGTM_RETENTION:-168h}
      TEMPO_EXTRA_ARGS: "-config.expand-env=true"
      LOKI_EXTRA_ARGS: "-compactor.retention-enabled=true -compactor.delete-request-store=filesystem -compactor.working-directory=/data/loki/compactor -store.retention=${LGTM_RETENTION:-168h}"
      # With host networking the collector would otherwise listen on every interface; keep OTLP on loopback.
      OTELCOL_EXTRA_ARGS: "--set=receivers.otlp.protocols.grpc.endpoint=127.0.0.1:4317 --set=receivers.otlp.protocols.http.endpoint=127.0.0.1:4318"
    volumes:
      - lgtm:/data
      - ./lgtm/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      - ./grafana/provisioning/dashboards/dispute-engine.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/dispute-engine.yaml:ro
      - ./grafana/provisioning/alerting/dispute-engine.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/dispute-engine.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/dispute-engine-dashboards:ro

  # Synthetic traffic so the dashboards are populated during a demo; needs `make db-seed` (otel-up runs it).
  probe:
    image: curlimages/curl:8.22.0
    network_mode: host
    profiles: [otel]
    depends_on: [api]
    volumes:
      - ./probe.sh:/probe.sh:ro
    entrypoint: ["sh", "/probe.sh"]
    environment:
      INTERVAL: ${PROBE_INTERVAL:-60}

volumes:
  pgdata:
  gomod:
  gobuild:
  lgtm:

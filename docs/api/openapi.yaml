openapi: 3.0.3
info:
  title: Dispute Engine API
  version: 0.1.0
  description: Issuer-side dispute lifecycle. Every mutation appends to the dispute's event log.
servers:
  - url: http://localhost:8090
# Every operation needs a tenant key unless it opts out with an empty security list.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      tags: [system]
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness (database reachable)
      tags: [system]
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /disputes:
    get:
      operationId: listDisputes
      summary: The tenant's disputes, newest first
      tags: [disputes]
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/DisputeState" }
        - name: reason
          in: query
          schema: { $ref: "#/components/schemas/DisputeReason" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque; from the previous page's nextCursor.
          schema: { type: string }
        - name: overdue
          in: query
          description: Only disputes with at least one regulatory clock past its due time and still open.
          schema: { type: boolean }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createDispute
      summary: Open a dispute against a transaction
      tags: [disputes]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDisputeRequest" }
      responses:
        "201":
          description: Dispute opened. Replays of the same Idempotency-Key return this same body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /disputes/{disputeId}:
    get:
      operationId: getDispute
      summary: Current state and full event log
      tags: [disputes]
      parameters:
        - $ref: "#/components/parameters/DisputeId"
      responses:
        "200":
          description: The dispute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /disputes/{disputeId}/events:
    post:
      operationId: applyDisputeEvent
      summary: Apply a lifecycle event
      tags: [disputes]
      parameters:
        - $ref: "#/components/parameters/DisputeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyEventRequest" }
      responses:
        "200":
          description: Event applied; the dispute after the transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: The event is not allowed from the current state, or a concurrent update won.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: >-
            The tenant's banking core gave no answer in time; nothing was written. Repeat the request with the same
            Idempotency-Key: the core sees the same posting reference and will not move the money twice.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /disputes/{disputeId}/email-templates:
    get:
      operationId: listEmailTemplates
      summary: The emails an analyst may compose for this dispute
      description: >-
        Each template comes with its form and its words, the facts the engine knows already filled in and the
        analyst's fields left as {{placeholders}}, so the browser can preview as the analyst types. The server
        renders the final message on send from the same template.
      tags: [disputes]
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTemplates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /disputes/{disputeId}/notices:
    post:
      operationId: composeEmail
      summary: Compose and send an email from a template
      description: >-
        Validates the fields against the template (invalid-fields, one error per field), composes the message
        server-side, queues the email and, where the regime requires writing and the template is a letter, the
        letter too. Analysts only; a tenant key cannot write to customers.
      tags: [disputes]
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComposeEmailRequest" }
      responses:
        "201":
          description: Queued; the dispute with its communications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /disputes/{disputeId}/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload a file to attach to an email
      description: >-
        A draft until an email claims it through ComposeEmailRequest.attachments; drafts older than a day are
        swept. PDF, PNG or JPEG, at most 5 MB. Analysts only.
      tags: [disputes]
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored as a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /disputes/{disputeId}/attachments/{attachmentId}:
    get:
      operationId: getAttachment
      summary: Download an attachment
      tags: [disputes]
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The file, with its own content type and a Content-Disposition naming it.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /disputes/{disputeId}/notices/{noticeId}/resend:
    post:
      operationId: resendNotice
      summary: Send an email again
      description: >-
        Queues a new email with the original's words to the customer's current address, chained to the original
        and authored by the analyst. Only an email that has been sent can be resent (not-resendable otherwise);
        an email still in the outbox is retried by the engine on its own. Analysts only.
      tags: [disputes]
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: noticeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "201":
          description: Queued; the dispute with its communications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The notice is a letter or was never sent.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /disputes/{disputeId}/notices/{noticeId}:
    get:
      operationId: getNotice
      summary: One communication to the customer, as composed
      description: The paragraphs as sent or as ready to print; the workbench renders letters from this.
      tags: [disputes]
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: noticeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The notice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /tenant-templates:
    get:
      operationId: listTenantTemplates
      summary: The tenant's wording for each analyst email kind
      description: Tenant admins only. Each kind comes with the base template, the tenant's override if any, and the result analysts see.
      tags: [tenant-templates]
      responses:
        "200":
          description: One entry per kind.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TemplateSetting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /tenant-templates/{kind}:
    put:
      operationId: putTenantTemplate
      summary: Set the tenant's wording for one kind
      description: >-
        Words only: label, description, subject, paragraphs and option texts by "fieldId.optionKey". The form
        (field ids and types) stays the base's. Placeholders must name the form's fields or the engine's facts;
        refused with invalid-template-override, one error per problem.
      tags: [tenant-templates]
      parameters:
        - name: kind
          in: path
          required: true
          schema: { $ref: "#/components/schemas/NoticeKind" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateOverride" }
      responses:
        "200":
          description: Stored; the entry as analysts now see it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: deleteTenantTemplate
      summary: Revert one kind to the base wording
      tags: [tenant-templates]
      parameters:
        - name: kind
          in: path
          required: true
          schema: { $ref: "#/components/schemas/NoticeKind" }
      responses:
        "204": { description: Reverted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /suggestions/search-filters:
    post:
      operationId: suggestSearchFilters
      summary: Read an analyst's sentence as search filters
      description: >
        A convenience, never a decision. The filters come back only when the model is sure enough, so an
        empty answer is the normal case and never an error; the analyst sees the filters and can change
        them before searching. Nothing is stored.
      tags: [suggestions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchFilterSuggestionRequest" }
      responses:
        "200":
          description: What the sentence appears to ask for, with any field the model was unsure of left out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchFilterSuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /suggestions/dispute-reason:
    post:
      operationId: suggestDisputeReason
      summary: Read what a customer wrote as a dispute reason
      description: >
        A convenience, never a decision. The reason comes back only when the model is sure enough, and the
        analyst confirms it before a dispute is opened; the description is read and not stored, so the
        record still holds only what a person chose.
      tags: [suggestions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeReasonSuggestionRequest" }
      responses:
        "200":
          description: The reason the description appears to describe, absent when the model was unsure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeReasonSuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /tenant:
    get:
      operationId: getTenant
      summary: What the workbench shows about the signed-in analyst's organisation
      tags: [tenants]
      responses:
        "200":
          description: The tenant's name and whether it has a logo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /tenant/logo:
    get:
      operationId: getTenantLogo
      summary: The organisation's logo
      tags: [tenants]
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      operationId: putTenantLogo
      summary: Replace the organisation's logo
      description: PNG, JPEG or WebP, at most 256 kB. Tenant admins only.
      tags: [tenants]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/avatar:
    get:
      operationId: getMyAvatar
      summary: The signed-in analyst's picture
      tags: [tenants]
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      operationId: putMyAvatar
      summary: Replace the signed-in analyst's picture
      description: PNG, JPEG or WebP, at most 256 kB. Analysts only; a tenant key has no person behind it.
      tags: [tenants]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /tenant-keys:
    get:
      operationId: listTenantKeys
      summary: The tenant's own keys, live and revoked
      description: Analysts with the tenant-admin role only; a tenant key cannot inspect keys.
      tags: [tenant-keys]
      responses:
        "200":
          description: Keys, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTenantKey
      summary: Issue a key for one of the tenant's systems
      description: The secret is in this response only; the server keeps its hash and prefix.
      tags: [tenant-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantKeyRequest" }
      responses:
        "201":
          description: Issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedTenantKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tenant-keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeTenantKey
      summary: Revoke a key; takes effect on the next request
      tags: [tenant-keys]
      responses:
        "204": { description: Revoked, or already revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: putSession
      summary: Store or replace an opaque session blob
      tags: [internal]
      security: [{ serviceKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionBlob" }
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      operationId: getSession
      summary: Fetch a session blob that has not expired
      tags: [internal]
      security: [{ serviceKey: [] }]
      responses:
        "200":
          description: The blob.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionBlob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSession
      summary: Remove a session
      tags: [internal]
      security: [{ serviceKey: [] }]
      responses:
        "204": { description: Removed, or never existed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /internal/sessions:
    delete:
      operationId: deleteSessions
      summary: End every session matching a realm session id or a tenant's subject
      tags: [internal]
      security: [{ serviceKey: [] }]
      parameters:
        - { name: sid, in: query, schema: { type: string } }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: subject, in: query, schema: { type: string } }
      responses:
        "200":
          description: How many sessions were ended.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /internal/tenants:
    get:
      operationId: listTenants
      summary: Active tenants with what the sign-in page needs to find their realm
      tags: [internal]
      security: [{ serviceKey: [] }]
      responses:
        "200":
          description: Active tenants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A tenant key (issued per tenant, shown once, stored hashed) or an analyst access token from the tenant's realm.
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Shared secret for the frontend server's internal endpoints; never issued to tenants or browsers.
  parameters:
    DisputeId:
      name: disputeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key. Same key and body replays the original response; same key with a different body is 422.
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: The tenant's request budget for the current minute is spent; retryAfterSeconds says when to try again.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, unknown or revoked tenant key.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The credential is valid but may not do this (an analyst without the tenant-admin role, or a tenant key on an analyst-only operation).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: Well-formed but not acceptable (idempotency key reused with a different body, no regime for the transaction, a liability or settlement the regime refuses, or a posting the banking core declined).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string }
    ErrorCode:
      type: string
      description: Stable machine-readable failure identifier; branch on this, never on text.
      enum:
        - unauthenticated
        - forbidden
        - rate-limited
        - malformed-request
        - contract-violation
        - not-found
        - invalid-transition
        - appeals-exhausted
        - invalid-liability
        - invalid-settlement
        - core-declined
        - unknown-reason
        - invalid-answers
        - risk-hold
        - invalid-fields
        - unknown-template
        - not-resendable
        - attachment-refused
        - attachment-unknown
        - invalid-template-override
        - concurrent-update
        - idempotency-key-reuse
        - image-refused
        - no-regime
        - unknown-regime
        - unavailable
        - internal
    Problem:
      type: object
      description: RFC 9457 problem details. Every field is safe to show to a user; diagnostics stay in server logs under requestId.
      required: [type, title, status, code, retryable, requestId]
      properties:
        type: { type: string, description: "urn:dispute-engine:error:<code>" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        retryable:
          type: boolean
          description: true when the same request (unavailable) or a re-evaluated one (concurrent-update) can succeed later.
        retryAfterSeconds: { type: integer }
        requestId: { type: string }
        allowedEvents:
          type: array
          description: Present on invalid-transition; what the dispute accepts right now.
          items: { $ref: "#/components/schemas/DisputeEvent" }
        errors:
          type: array
          description: Field-level failures for contract-violation and business validation; field is a JSON pointer into the body, or query.x / header.x / path.x.
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: "/transactionId" }
        message: { type: string }
    Tenant:
      type: object
      required: [name, hasLogo]
      properties:
        name: { type: string }
        hasLogo: { type: boolean, description: Whether GetTenantLogo will answer with an image. }
        logoUpdatedAt: { type: string, format: date-time }
    TenantKey:
      type: object
      required: [id, prefix, label, createdAt, status]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string, description: The first characters of the key, enough to match a value seen in a log. }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        status: { type: string, enum: [live, expired, revoked] }
    CreateTenantKeyRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 80, description: Which system will hold it. }
        expiresAt: { type: string, format: date-time, description: Optional; the key stops working after this. }
    IssuedTenantKey:
      allOf:
        - $ref: "#/components/schemas/TenantKey"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: Shown once. }
    TenantSummary:
      type: object
      required: [id, slug, name, emailDomains]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        issuer: { type: string, description: OIDC issuer of the tenant's realm. }
        emailDomains: { type: array, items: { type: string }, description: Work-email domains that map to this tenant at sign-in. }
    SessionBlob:
      type: object
      description: Ciphertext the frontend server produced; the API stores it without being able to read it.
      required: [ciphertext, expiresAt]
      properties:
        tenantId: { type: string, format: uuid, description: Set once the session belongs to a signed-in analyst; informational. }
        subject: { type: string, description: The analyst's subject at the realm, so all of a user's sessions can be ended. }
        sid: { type: string, description: The realm's session id from the ID token, for back-channel logout. }
        ciphertext: { type: string, format: byte, maxLength: 16384 }
        expiresAt: { type: string, format: date-time }
    Regime:
      type: string
      enum: [EU_SEPA_DIRECT_DEBIT, EU_PSD2_CARD, US_REG_E, US_REG_Z]
    DisputeReasonSuggestionRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the customer said, in any language.
      additionalProperties: false
    DisputeReasonSuggestion:
      type: object
      description: An absent reason means the model was not sure enough to offer one.
      properties:
        reason: { $ref: "#/components/schemas/DisputeReason" }
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: How sure the model was, recorded with the dispute when the analyst accepts it.
      additionalProperties: false
    SearchFilterSuggestionRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 300
          description: What the analyst typed, in any language.
      additionalProperties: false
    SearchFilterSuggestion:
      type: object
      description: Every field is optional; an absent field is one the model was not sure enough about.
      properties:
        state: { $ref: "#/components/schemas/DisputeState" }
        reason: { $ref: "#/components/schemas/DisputeReason" }
        overdue:
          type: boolean
          description: Present only when the sentence asks for disputes past a deadline.
      additionalProperties: false
    DisputeState:
      type: string
      enum:
        - INITIATED
        - INVESTIGATING
        - QUESTIONNAIRE_SENT
        - QUESTIONNAIRE_RECEIVED
        - PROVISIONAL_CREDIT_ISSUED
        - FAST_REFUND_ISSUED
        - SEPA_NQA_REFUND_ISSUED
        - CHARGEBACK_FILED
        - CHARGEBACK_ACKNOWLEDGED
        - EVIDENCE_SUBMITTED
        - CHARGEBACK_WON
        - CHARGEBACK_LOST
        - FINAL_CREDIT_ISSUED
        - PROVISIONAL_CREDIT_REVERSED
        - CLOSED
    DisputeEvent:
      type: string
      enum:
        - OPEN_INVESTIGATION
        - SEND_QUESTIONNAIRE
        - RECEIVE_QUESTIONNAIRE
        - ISSUE_REFUND
        - FILE_CHARGEBACK
        - ACKNOWLEDGE_CHARGEBACK
        - SUBMIT_EVIDENCE
        - WIN_CHARGEBACK
        - LOSE_CHARGEBACK
        - ISSUE_FINAL_CREDIT
        - REVERSE_PROVISIONAL_CREDIT
        - CLOSE
        - APPEAL
    CreateDisputeRequest:
      type: object
      required: [transactionId]
      properties:
        transactionId: { type: string, format: uuid }
        reason:
          description: Why the customer disputes it; selects the questionnaire. Defaults to UNAUTHORISED.
          $ref: "#/components/schemas/DisputeReason"
        actor: { type: string, description: "Who opened it; defaults to customer.", default: customer }
    DisputeReason:
      type: string
      enum: [UNAUTHORISED, NOT_RECEIVED, DUPLICATE, AMOUNT_DIFFERS]
    ApplyEventRequest:
      type: object
      required: [event]
      properties:
        event: { $ref: "#/components/schemas/DisputeEvent" }
        actor: { type: string, default: system }
        payload:
          type: object
          description: >-
            Event-specific facts, stored verbatim on the log entry. Two are read by the ledger: on ISSUE_REFUND,
            `liability` is the amount the customer bears (a decimal string, capped by the regime, refused with
            invalid-liability); on CLOSE, `settlement` says how an outstanding advance clears (RECOVERED or
            WRITTEN_OFF; the regime's default when absent; refused with invalid-settlement); on
            RECEIVE_QUESTIONNAIRE, `answers` maps question ids to answers and is validated against the questions
            that were sent (refused with invalid-answers, one error per question). On ISSUE_REFUND for a dispute
            whose latest risk tier is HIGH, `riskOverride` must carry the analyst's justification or the credit is
            refused with risk-hold.
          additionalProperties: true
          properties:
            liability: { type: string, example: "50.00" }
            settlement: { $ref: "#/components/schemas/SuspenseSettlement" }
            answers:
              type: object
              additionalProperties: { type: string }
            riskOverride: { type: string, description: Why a credit goes out despite a HIGH risk score; recorded on the event. }
    SuspenseSettlement:
      type: string
      enum: [RECOVERED, WRITTEN_OFF]
    LedgerAccount:
      type: string
      description: CUSTOMER is the disputing customer's account; SUSPENSE holds what the bank advanced; RECOVERY and LOSS clear it.
      enum: [CUSTOMER, SUSPENSE, RECOVERY, LOSS]
    PostingKind:
      type: string
      enum: [PROVISIONAL_CREDIT, FAST_REFUND, NQA_REFUND, PROVISIONAL_CREDIT_REVERSAL, RECOVERY, WRITE_OFF]
    LedgerEntry:
      type: object
      description: One double-entry movement the engine instructed; amount leaves the credit account and lands in the debit account.
      required: [seq, kind, debit, credit, amount, currency, reference, postedAt]
      properties:
        seq: { type: integer, description: The event that caused it. }
        kind: { $ref: "#/components/schemas/PostingKind" }
        debit: { $ref: "#/components/schemas/LedgerAccount" }
        credit: { $ref: "#/components/schemas/LedgerAccount" }
        amount: { type: string, description: Decimal as a string at the currency's minor unit; never a float. }
        currency: { type: string, minLength: 3, maxLength: 3 }
        reference: { type: string, description: Unique per posting; what the banking core is told. }
        postedAt: { type: string, format: date-time }
        core:
          description: The banking core's answer; present for postings that moved the customer's money.
          $ref: "#/components/schemas/CoreReceipt"
    CoreReceipt:
      type: object
      required: [rrn, responseCode, latencyMs]
      properties:
        rrn: { type: string, description: Retrieval reference number (ISO 8583 DE37); empty when the tenant has no core. }
        responseCode: { type: string, description: ISO 8583 DE39; 00 approved, 94 duplicate of an earlier approval. }
        latencyMs: { type: integer, format: int64 }
    Balances:
      type: object
      description: Running totals per account; customer from the customer's side (positive means credited), the rest from the bank's.
      required: [customer, suspense, recovery, loss]
      properties:
        customer: { type: string }
        suspense: { type: string }
        recovery: { type: string }
        loss: { type: string }
    LoggedEvent:
      type: object
      required: [seq, event, fromState, toState, actor, payload, occurredAt]
      properties:
        seq: { type: integer }
        event: { type: string, description: "A DisputeEvent, or OPENED for entry 1." }
        fromState: { type: string }
        toState: { $ref: "#/components/schemas/DisputeState" }
        actor: { type: string }
        payload: { type: object, additionalProperties: true }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
    DisputeSummary:
      type: object
      required: [id, regime, reason, state, transactionId, disputedAmount, currency, openedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        regime: { $ref: "#/components/schemas/Regime" }
        reason: { $ref: "#/components/schemas/DisputeReason" }
        state: { $ref: "#/components/schemas/DisputeState" }
        transactionId: { type: string, format: uuid }
        disputedAmount: { type: string, description: Decimal as a string at the currency's minor unit; never a float. }
        currency: { type: string, minLength: 3, maxLength: 3 }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        nextDeadline:
          description: The open regulatory clock that runs out first; absent once every clock is settled.
          $ref: "#/components/schemas/Deadline"
        riskTier: { $ref: "#/components/schemas/RiskTier" }
        riskScore: { type: integer }
    DisputePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DisputeSummary" }
        nextCursor: { type: string, description: Present when there is another page. }
    Dispute:
      type: object
      required: [id, regime, reason, state, appeals, version, transactionId, accountId, disputedAmount, currency, openedAt, updatedAt, allowedEvents, events, deadlines, ledger, balances, notices]
      properties:
        id: { type: string, format: uuid }
        regime: { $ref: "#/components/schemas/Regime" }
        reason: { $ref: "#/components/schemas/DisputeReason" }
        state: { $ref: "#/components/schemas/DisputeState" }
        appeals: { type: integer }
        version: { type: integer, format: int64 }
        transactionId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        disputedAmount: { type: string, description: "Decimal as a string at the currency's minor unit; never a float.", example: "125.40" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        allowedEvents:
          type: array
          items: { $ref: "#/components/schemas/DisputeEvent" }
        events:
          type: array
          items: { $ref: "#/components/schemas/LoggedEvent" }
        deadlines:
          description: Every regulatory clock the regime started for this dispute, opening clocks first, then per appeal.
          type: array
          items: { $ref: "#/components/schemas/Deadline" }
        ledger:
          description: Every movement the engine instructed on this dispute, in posting order.
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        balances: { $ref: "#/components/schemas/Balances" }
        questionnaire:
          description: Present once SEND_QUESTIONNAIRE has been applied.
          $ref: "#/components/schemas/Questionnaire"
        notices:
          description: Every communication owed to the customer so far, in the order it arose.
          type: array
          items: { $ref: "#/components/schemas/Notice" }
        risk:
          description: The latest fraud assessment; absent for disputes opened before scoring existed.
          $ref: "#/components/schemas/Risk"
    RiskTier:
      type: string
      description: LOW proceeds; MEDIUM is flagged for the analyst; HIGH holds credits until a justification is recorded.
      enum: [LOW, MEDIUM, HIGH]
    RiskSignal:
      type: object
      required: [name, weight, points, detail]
      properties:
        name: { type: string }
        weight: { type: integer, description: The most this signal can add. }
        points: { type: integer }
        detail: { type: string, description: Why it scored what it did, in words. }
    Risk:
      type: object
      required: [score, tier, signals, assessedAt, history]
      properties:
        score: { type: integer }
        tier: { $ref: "#/components/schemas/RiskTier" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/RiskSignal" }
        assessedAt: { type: string, format: date-time }
        history:
          type: array
          description: Earlier assessments, oldest first; the score moves when the questionnaire arrives.
          items:
            type: object
            required: [seq, score, tier, assessedAt]
            properties:
              seq: { type: integer }
              score: { type: integer }
              tier: { $ref: "#/components/schemas/RiskTier" }
              assessedAt: { type: string, format: date-time }
    NoticeKind:
      type: string
      description: The first six the engine sends on its own; the rest an analyst composes from a template.
      enum: [ACKNOWLEDGEMENT, QUESTIONNAIRE, PROVISIONAL_CREDIT, REFUND, REVERSAL, RESOLUTION, REQUEST_FOR_INFORMATION, STATUS_UPDATE, DOCUMENTS_RECEIVED, CUSTOM]
    Channel:
      type: string
      description: EMAIL goes out through the mail relay; LETTER is a printable document, ready the moment it exists.
      enum: [EMAIL, LETTER]
    Notice:
      type: object
      required: [id, seq, kind, channel, recipient, subject, createdAt, attachments]
      properties:
        id: { type: integer, format: int64 }
        seq: { type: integer, description: The event that caused it. }
        kind: { $ref: "#/components/schemas/NoticeKind" }
        channel: { $ref: "#/components/schemas/Channel" }
        recipient: { type: string }
        subject: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, description: Absent while an email waits in the outbox. }
        error: { type: string, description: The last delivery failure, if the email is still waiting. }
        actor: { type: string, description: The analyst who composed it; absent for the engine's own notices. }
        resendOf: { type: integer, format: int64, description: The notice this one repeats, for a resend. }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
    Attachment:
      type: object
      required: [id, filename, contentType, size]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer }
    FieldType:
      type: string
      description: TEXT and TEXTAREA are free text; NUMBER a whole number; DATE YYYY-MM-DD; SELECT one option key; MULTISELECT comma-separated option keys.
      enum: [TEXT, TEXTAREA, NUMBER, DATE, SELECT, MULTISELECT]
    TemplateOption:
      type: object
      required: [key, label, text]
      properties:
        key: { type: string }
        label: { type: string, description: What the analyst sees. }
        text: { type: string, description: What the customer reads. }
    TemplateField:
      type: object
      required: [id, label, type, required]
      properties:
        id: { type: string }
        label: { type: string }
        type: { $ref: "#/components/schemas/FieldType" }
        required: { type: boolean }
        options:
          type: array
          items: { $ref: "#/components/schemas/TemplateOption" }
        list: { type: boolean, description: A TEXTAREA whose lines are items, rendered as bullet lines. }
        default: { type: string }
        min: { type: integer }
        max: { type: integer }
    EmailTemplate:
      type: object
      required: [kind, label, description, letter, fields, subject, paragraphs]
      properties:
        kind: { $ref: "#/components/schemas/NoticeKind" }
        label: { type: string }
        description: { type: string }
        letter: { type: boolean, description: Also goes out as a letter where the regime requires written notices. }
        fields:
          type: array
          items: { $ref: "#/components/schemas/TemplateField" }
        subject: { type: string, description: "Facts filled in; fields left as {{id}}." }
        paragraphs:
          type: array
          description: >-
            Facts filled in; fields left as {{id}}; {{#id}}...{{/id}} appears only when the field has a value; a
            paragraph that is only a list field renders as bullet lines; empty paragraphs are dropped.
          items: { type: string }
    EmailTemplates:
      type: object
      required: [templates, facts]
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/EmailTemplate" }
        facts:
          type: object
          description: The engine-known values, for the preview's greeting and letterhead.
          required: [customer, bank, amount, merchant, dispute, today]
          properties:
            customer: { type: string }
            bank: { type: string }
            amount: { type: string }
            merchant: { type: string }
            dispute: { type: string }
            today: { type: string, format: date }
    TemplateOverride:
      type: object
      description: A tenant's wording; empty members leave the base as it is.
      properties:
        label: { type: string }
        description: { type: string }
        subject: { type: string }
        paragraphs:
          type: array
          items: { type: string }
        optionTexts:
          type: object
          description: Customer-facing text per option, keyed "fieldId.optionKey".
          additionalProperties: { type: string }
    TemplateSetting:
      type: object
      required: [base, effective]
      properties:
        base: { $ref: "#/components/schemas/EmailTemplate" }
        override: { $ref: "#/components/schemas/TemplateOverride" }
        effective: { $ref: "#/components/schemas/EmailTemplate" }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ComposeEmailRequest:
      type: object
      required: [template, fields]
      properties:
        template: { $ref: "#/components/schemas/NoticeKind" }
        fields:
          type: object
          description: Field id to value; MULTISELECT values are comma-separated option keys.
          additionalProperties: { type: string }
        attachments:
          type: array
          description: Draft attachment ids uploaded for this dispute, at most 3; they travel with the email and are listed on the letter.
          items: { type: string, format: uuid }
    NoticeDocument:
      type: object
      required: [id, kind, channel, recipient, bank, date, subject, greeting, paragraphs, closing]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/NoticeKind" }
        channel: { $ref: "#/components/schemas/Channel" }
        recipient: { type: string }
        bank: { type: string }
        date: { type: string, format: date-time }
        subject: { type: string }
        greeting: { type: string }
        paragraphs:
          type: array
          items: { type: string }
        closing: { type: string }
        basis: { type: string, description: The provision the notice satisfies, when one does. }
        sentAt: { type: string, format: date-time }
    AnswerType:
      type: string
      description: How an answer is validated; every answer travels as a string ("yes"/"no", YYYY-MM-DD, free text, decimal).
      enum: [YES_NO, DATE, TEXT, AMOUNT]
    Question:
      type: object
      required: [id, text, type, required]
      properties:
        id: { type: string }
        text: { type: string }
        type: { $ref: "#/components/schemas/AnswerType" }
        required: { type: boolean }
    Questionnaire:
      type: object
      required: [reason, questions, inconsistencies, sentAt]
      properties:
        reason: { $ref: "#/components/schemas/DisputeReason" }
        questions:
          type: array
          description: The questions as they were asked; a later change to the set never affects a sent questionnaire.
          items: { $ref: "#/components/schemas/Question" }
        answers:
          type: object
          additionalProperties: { type: string }
        inconsistencies:
          type: array
          description: Contradictions found between the answers; empty until received or when none.
          items: { type: string }
        sentAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
    DeadlineKind:
      type: string
      enum: [REFUND, ACKNOWLEDGE, RESOLUTION]
    DeadlineStatus:
      type: string
      description: RUNNING and BREACHED are open; MET and LATE are satisfied (before or after due); VOID no longer applies.
      enum: [RUNNING, MET, LATE, BREACHED, VOID]
    Deadline:
      type: object
      required: [kind, cycle, startedAt, dueAt, status, basis]
      properties:
        kind: { $ref: "#/components/schemas/DeadlineKind" }
        cycle: { type: integer, description: 0 for the clocks started at opening; the appeal number for a restarted clock. }
        startedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, description: End of the last permitted day in the tenant's calendar. }
        metAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/DeadlineStatus" }
        basis: { type: string, description: The regulatory provision the clock comes from. }

# golangci-lint v2 (pinned in mise.toml; CI installs the same version).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gosec
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - errorlint
    - gocritic
    - prealloc
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["sayRepetitiveInsteadOfStutters"]
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        # Small structs are passed and ranged by value on purpose; the copy is
        # cheaper to reason about than aliasing.
        - hugeParam
        - rangeValCopy
    gosec:
      excludes:
        # G101 matches any identifier containing "cred"; this domain is full
        # of provisional/final credit. Real secrets never live in source.
        - G101
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, unparam, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/muneeebnaveeed/thesis-dispute-engine

version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/dispute/infrastructure/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/dispute/infrastructure/postgres/sqlcgen
        sql_package: pgx/v5
        emit_methods_with_db_argument: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: timestamptz
            go_type: time.Time
          - db_type: jsonb
            go_type:
              type: "[]byte"

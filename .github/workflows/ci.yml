name: CI
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR supersedes the runs already in flight; pushes to
# main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Single source of truth is mise.toml; jobs read it rather than pinning.
  MISE_TOML: mise.toml

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      go: ${{ steps.versions.outputs.go }}
      golangci: ${{ steps.versions.outputs.golangci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'mise.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
      - name: Read toolchain versions from mise.toml
        id: versions
        run: |
          echo "go=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "golangci=$(sed -n 's/^golangci-lint = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

  runtime-versions:
    name: Check runtime versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-runtime-versions.sh

  backend:
    name: backend ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            run: golangci-lint fmt --diff
          - name: vet
            run: go vet ./...
          - name: lint
            run: golangci-lint run ./...
          - name: test
            run: go test -race -count=1 ./...
          - name: tidy
            run: go mod tidy && git diff --exit-code -- go.mod go.sum
          - name: vuln
            run: go tool govulncheck ./...
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.changes.outputs.go }}
          cache-dependency-path: backend/go.sum
      - name: Install golangci-lint
        if: matrix.name == 'lint' || matrix.name == 'format'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ needs.changes.outputs.golangci }}
          working-directory: backend
          install-mode: binary
          # The action would run the linter itself; the matrix step does that.
          args: --help
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  image:
    name: backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend/Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: dispute-engine-api:ci
          build-args: |
            GO_VERSION=${{ needs.changes.outputs.go }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        # Host networking, same as deploy/compose.yml, so no port mapping is
        # involved; the container must answer /healthz within a few seconds.
        run: |
          docker run -d --network host --name api dispute-engine-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8090/healthz; then echo; exit 0; fi
            sleep 0.5
          done
          echo "healthz never answered"; docker logs api; exit 1

  frontend:
    name: frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Replace with pnpm/action-setup + setup-node (cache: pnpm) and a check matrix once frontend/ exists.
      - name: Placeholder
        run: |
          if [ -f package.json ]; then echo "frontend exists: add real steps"; exit 1; fi
          echo "no frontend yet"

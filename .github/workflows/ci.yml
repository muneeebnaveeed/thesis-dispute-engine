name: CI
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR supersedes the runs already in flight; pushes to
# main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Single source of truth is mise.toml; jobs read it rather than pinning.
  MISE_TOML: mise.toml

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      go: ${{ steps.versions.outputs.go }}
      golangci: ${{ steps.versions.outputs.golangci }}
      sqlc: ${{ steps.versions.outputs.sqlc }}
      node: ${{ steps.versions.outputs.node }}
      pnpm: ${{ steps.versions.outputs.pnpm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'mise.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'docs/api/openapi.yaml'
              - 'mise.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
      - name: Read toolchain versions from mise.toml
        id: versions
        run: |
          echo "go=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "golangci=$(sed -n 's/^golangci-lint = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "sqlc=$(sed -n 's/^sqlc = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "node=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

  runtime-versions:
    name: Check runtime versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-runtime-versions.sh

  backend:
    name: backend ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            run: golangci-lint fmt --diff
          - name: vet
            run: go vet ./...
          - name: lint
            run: golangci-lint run ./...
          - name: tidy
            run: go mod tidy && git diff --exit-code -- go.mod go.sum
          - name: vuln
            run: go tool govulncheck ./...
          - name: generate
            run: sqlc generate && go generate ./... && git diff --exit-code -- internal/dispute/infrastructure/postgres/sqlcgen internal/dispute/ports/http/oapi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.changes.outputs.go }}
          cache-dependency-path: backend/go.sum
      - name: Cache sqlc
        if: matrix.name == 'generate'
        id: sqlc-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/sqlc
          key: sqlc-${{ runner.os }}-${{ needs.changes.outputs.sqlc }}
      - name: Install sqlc
        if: matrix.name == 'generate' && steps.sqlc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/sqlc-dev/sqlc/releases/download/v${{ needs.changes.outputs.sqlc }}/sqlc_${{ needs.changes.outputs.sqlc }}_linux_amd64.tar.gz" \
            | tar -xz -C ~/.local/bin sqlc
      - name: sqlc version
        if: matrix.name == 'generate'
        run: sqlc version
      - name: Install golangci-lint
        if: matrix.name == 'lint' || matrix.name == 'format'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ needs.changes.outputs.golangci }}
          working-directory: backend
          install-mode: binary
          # The action would run the linter itself; the matrix step does that.
          args: --help
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  backend-test:
    name: backend test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispute
          POSTGRES_PASSWORD: dispute
          POSTGRES_DB: dispute
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispute -d dispute"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.changes.outputs.go }}
          cache-dependency-path: backend/go.sum
      # The profile from the last push to main is the baseline PRs report their delta against.
      - name: Restore baseline coverage
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: backend/coverage.out
          key: coverage-main-${{ github.event.pull_request.base.sha }}
          restore-keys: coverage-main-
      - name: Keep baseline aside
        if: github.event_name == 'pull_request'
        run: '[ -f coverage.out ] && mv coverage.out coverage-base.out || true'
      - name: Create the API login role
        run: psql postgres://dispute:dispute@localhost:5432/dispute -v ON_ERROR_STOP=1 -q -f ../deploy/postgres/roles.sql
      - name: go test -race (unit + Postgres integration)
        env:
          DISPUTE_TEST_DATABASE_URL: postgres://dispute:dispute@localhost:5432/dispute?sslmode=disable
          DISPUTE_TEST_APP_DATABASE_URL: postgres://dispute_api:dispute_api@localhost:5432/dispute?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage report
        run: |
          ../scripts/coverage-report coverage.out coverage-base.out | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save baseline coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: backend/coverage.out
          key: coverage-main-${{ github.sha }}
      # One sticky comment per PR, found again by its marker. Forks get a read-only token, so skip them.
      - name: Comment coverage on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- coverage-report -->'
          { echo "$marker"; cat coverage.md; } > comment.md
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))) | .[0].id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md > /dev/null
          fi

  image:
    name: backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The API checks the schema at startup, so the smoke test needs a migrated database.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispute
          POSTGRES_PASSWORD: dispute
          POSTGRES_DB: dispute
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispute -d dispute"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend/Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: dispute-engine-api:ci
          build-args: |
            GO_VERSION=${{ needs.changes.outputs.go }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Smoke test the image
        # Host networking, same as deploy/compose.yml, so no port mapping is involved. Exercises all three
        # entrypoints the way compose does: migrate as owner, then the API as the least-privileged login.
        run: |
          psql postgres://dispute:dispute@localhost:5432/dispute -v ON_ERROR_STOP=1 -q -f deploy/postgres/roles.sql
          docker run --rm --network host --entrypoint /migrate dispute-engine-api:ci
          docker run -d --network host --name api dispute-engine-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8090/readyz; then echo; exit 0; fi
            sleep 0.5
          done
          echo "readyz never answered"; docker logs api; exit 1

  frontend:
    name: frontend ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck
            run: pnpm generate-routes && pnpm typecheck
          - name: lint
            run: pnpm generate-routes && pnpm lint
          - name: format
            run: pnpm fmt
          - name: test
            run: pnpm generate-routes && pnpm test
          - name: build
            run: pnpm generate-routes && pnpm build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ needs.changes.outputs.pnpm }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.changes.outputs.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  frontend-image:
    name: frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend/Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          load: true
          tags: dispute-engine-frontend:ci
          build-args: |
            NODE_VERSION=${{ needs.changes.outputs.node }}
            PNPM_VERSION=${{ needs.changes.outputs.pnpm }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --network host --name frontend dispute-engine-frontend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3002/ | grep -q 'Dispute Engine'; then echo ok; exit 0; fi
            sleep 0.5
          done
          echo "frontend never rendered"; docker logs frontend; exit 1

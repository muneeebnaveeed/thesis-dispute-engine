name: e2e

# Browser suite against the full stack. Deliberately its own workflow: it reports on every PR and keeps running on
# main after merge, but it is not part of the ci gate and must not be made a required check.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'docs/api/**'
      - 'mise.toml'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Read toolchain versions from mise.toml
        id: versions
        run: |
          for t in go node pnpm; do
            echo "$t=$(sed -n "s/^$t = \"\(.*\)\"$/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"
          done
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start Postgres, the API and Keycloak
        run: |
          docker compose -f deploy/compose.yml up -d --wait postgres
          docker compose -f deploy/compose.yml exec -T postgres psql -U dispute -d dispute -v ON_ERROR_STOP=1 -q < deploy/postgres/roles.sql
          GO_VERSION=${{ steps.versions.outputs.go }} docker compose -f deploy/compose.yml --profile app --profile auth up -d --build --wait migrate api keycloak mailpit
          docker compose -f deploy/compose.yml exec -T postgres psql -U dispute -d dispute -v ON_ERROR_STOP=1 -q < deploy/postgres/roles.sql
          docker compose -f deploy/compose.yml --profile app run --rm --no-deps --entrypoint /seed api
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the browser suite
        run: pnpm e2e
        working-directory: frontend
        env:
          CI: "true"
      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml --profile app --profile auth logs --no-color --tail 200

